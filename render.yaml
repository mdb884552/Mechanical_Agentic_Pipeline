services:
  - type: web
    name: aero-opt
    runtime: python
    buildCommand: |
      pip install -r requirements-web.txt &&
      cd dashboard/frontend &&
      npm install &&
      npm run build
    startCommand: uvicorn dashboard.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.8"
